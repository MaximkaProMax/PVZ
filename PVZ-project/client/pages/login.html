<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/client/src/login.css"></link>
    <title>Log in</title>
</head>
<body>
    <div class="auth-card">
        <h1>Авторизация</h1>
        <p class="subtitle">Добро пожаловать, введите Ваши данные</p>
        
        <div class="field">
            <label>Email</label>
            <input type="email">
        </div>
        
        <div class="field">
            <label>Пароль</label>
            <input type="password">
        </div>
        
        <div class="row">
            <label class="checkbox">
                <input type="checkbox" checked> Запомнить меня
            </label>
            <a href="password.html" class="forgot">Забыли пароль?</a>
        </div>
        
        <a href="/client/pages/main.html"><button>Войти</button></a>
        
        <p class="register">
            Нет аккаунта? <a href="registration.html">Зарегистрируйся</a>
        </p>
    </div>
</body>
</html>
